<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">NextSeason TV App Icon</title>
<desc id="desc">A teal television behind a calendar on a cool gray vertical gradient.</desc>
<defs>
