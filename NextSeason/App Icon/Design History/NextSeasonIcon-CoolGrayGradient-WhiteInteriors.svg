    <rect id="Calendar-Page" x="490" y="535" width="330" height="245" rx="42" fill="#F8F9FA"/>
    <rect id="Calendar-Tab-Left" x="555" y="365" width="48" height="132" rx="24" fill="#0D6B63" stroke="#F8F9FA" stroke-width="18"/>
    <rect id="Calendar-Tab-Right" x="708" y="365" width="48" height="132" rx="24" fill="#0D6B63" stroke="#F8F9FA" stroke-width="18"/>

