      <rect id="Date-2" x="629" y="600" width="52" height="52" rx="11"/>
      <rect id="Date-3" x="703" y="600" width="52" height="52" rx="11"/>
      <rect id="Date-4" x="555" y="682" width="52" height="52" rx="11"/>
      <rect id="Date-5" x="629" y="682" width="52" height="52" rx="11"/>
      <rect id="Date-6" x="703" y="682" width="52" height="52" rx="11"/>
    </g>
  </g>
